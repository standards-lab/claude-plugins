# Project kind: this repository is context (skills, manifests, prose), not production
# source code.
[project]
kind = "context"
# The repository's one deterministic check, which every slice and review runs.
check = "scripts/check.sh"
# The read-only, development-time command that reports every pin trailing its latest
# release; it reads the network, so CI never runs it.
currency = "scripts/currency.sh"
# The release gate SHIP runs before each <plugin>/v<version> tag: the check, then that plugin's
# eval suite when it has one.
gate = "scripts/gate.sh"

# Remote platform, the command that publishes a finished branch, the command that merges
# it once its checks pass, and the command that waits for main's CI on the merge commit before
# a release is tagged.
[remote]
platform = "github"
publish = "gh pr create"
merge = "gh pr checks --watch && gh pr merge --merge --delete-branch"
ci = '''
sha=$(git rev-parse HEAD)
for _ in $(seq 30); do
  runs=$(gh run list --commit "$sha" --event push --json databaseId --jq '.[].databaseId')
  [ -n "$runs" ] && break || sleep 10
done
[ -n "$runs" ] || exit 1
for run in $runs; do gh run watch --exit-status "$run" || exit 1; done
'''
