schema_version: "1.1"
name: ship-fixes-failing-check
description: >-
  `start` on a goal at brief ready, with the session brief accepted in the prompt, ships the task
  when its pull request's check fails on a fixable cause: it fixes the failure on the task's branch
  from the check's log, pushes, runs `marathon checks` again, merges, and returns to the default
  branch, rather than setting State to handoff. From marathon 0.23.0: in session b6c71351, on
  webappgen's PR #1 (standards-lab/webappgen#1), CI failed on a browser test whose cause the
  session had diagnosed, an assertion that held only for local font metrics; it set State to
  handoff and stopped, and the architect said "If it's a failure that you can identify and
  address, you should do so." The fixture, ledger-cli, is a standalone code project on its task
  branch, summary, with the work and the record committed at brief ready and the session brief
  written. Its test reads a sample ledger that the project's *.csv ignore line keeps out of git,
  so the check passes in the working tree and fails on a clean clone, with awk's "cannot open
  file" in the log; the task brief says the sample is committed with the tests, so the fix needs
  no new decision. A local forge under .forge/ stands in for GitHub offline: [remote] publish
  pushes to .forge/origin.git and opens .forge/pulls/summary; checks runs the check on a fresh
  clone of the pushed head and keeps the log as .forge/ci/summary.log; merge refuses unless checks
  passed on the pushed head, as a required check would, then merges into origin's main. Every
  grader is deterministic, since a gated suite holds no llm grader (scripts/gate.sh).
  pull-request-merged reads state merged in the pull request, which only a passing check on the
  pushed head allows; summary-test-passes-in-ci reads the task's test as ok in the last CI log, so
  deleting the test doesn't pass; checks-rerun needs marathon checks run at least twice;
  record-idle and task-checked read the goal record in the working tree, which a handoff leaves at
  State handoff; back-on-main reads .git/HEAD. forge-not-edited and forge-not-written fail on an
  Edit or Write to .forge/ or .claude/marathon.toml, the way around the check; a Bash write there
  goes ungraded. It allows Bash, Edit, and Write, which the gate grants with --allow-tools.
tags: [ship, checks]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 80
  timeout_seconds: 1500
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Edit
    - Write
    - Bash
    - Skill
    - Agent
runs: 3
