schema_version: "1.1"
name: plan-round-in-reply
description: >-
  `start` on a task with no brief shows PLAN ROUND 1 in the reply, as numbered questions that each
  carry rec: and changes: lines and stand on their own, in markdown outside any code fence, no line
  over 100 characters. From marathon 0.16.x: plan rounds were shown as AskUserQuestion headlines and
  the architect rejected them three times, with "I need to see the details for each Round 1
  decision" (sessions f93cf790, 11b56c96, b23222ce), and a question asked without its context drew
  "What is this in reference to?" (32b442ee). The case checks the round's shape in the reply only:
  under `claude plugin eval` 2.1.289 it runs as `claude -p --permission-mode dontAsk` with no
  permission-prompt tool, which drops AskUserQuestion, EnterPlanMode, and ExitPlanMode, so it can't
  reproduce the original failure. Its AskUserQuestion grader stays for when eval offers that tool.
  It allows no Bash: the fixture declares no currency command and no remote, so round 1 needs only
  reads. The graders read the round from the line that contains PLAN ROUND 1, headed as
  references/briefs.md shows it. line-width fails a line of 101 or more characters from there to
  the first line that contains reply:, or to the end of the reply when the round has none; its u
  flag counts characters, not UTF-16 units. no-code-fence fails when that line follows an odd
  number of fence lines, so the last one opens a block the round sits in; a fence line may be
  indented or quoted, and opens with ``` or ~~~. numbered-questions needs two numbered questions,
  each with a rec: line and then a changes: line before the next numbered line, allowing
  indentation, list bullets, and bold markup before each. self-contained-questions judges the
  lines from the one that contains PLAN ROUND 1 through the first that contains reply:, and fails
  only on a listed fault: no numbered question, a question line that doesn't name its subject and
  options, a missing rec: or one without its reason, a reference to text outside the question, or
  deferred options. It lists what isn't a fault, such as a file named while its content is
  stated, or facts repeated from Facts found. The gate runs its judge on sonnet
  (--judge-model sonnet), since eval's default, haiku, flipped verdicts on the same round.
tags: [plan, plan-round]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Skill
    - Agent
    - AskUserQuestion
runs: 3
