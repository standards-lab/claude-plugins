schema_version: "1.1"
name: plan-round-in-reply
description: >-
  `start` on a task with no brief shows PLAN ROUND 1 in the reply, as numbered questions that each
  carry rec: and changes: lines and stand on their own, and never asks them through
  AskUserQuestion. From marathon 0.16.x: plan rounds were shown as AskUserQuestion headlines and
  the architect rejected them three times, with "I need to see the details for each Round 1
  decision" (sessions f93cf790, 11b56c96, b23222ce), and a question asked without its context
  drew "What is this in reference to?" (32b442ee).
tags: [plan, plan-round]
context:
  # Builds a standalone context project whose active goal's next task leaves two decisions open.
  scaffold_script: scaffold.sh
execution:
  # Enough for LOCATE, START, a planner subagent, and round 1; the run ends at the round, since
  # no human answers it.
  max_turns: 40
  timeout_seconds: 900
  # The failure this case guards against happened in plan mode, whose prompt says to end each
  # turn with AskUserQuestion or ExitPlanMode. Under `claude plugin eval` 2.1.289 that can't be
  # reproduced: the child runs `claude -p --permission-mode dontAsk --setting-sources user`
  # with no --permission-prompt-tool, and a -p session without one drops AskUserQuestion,
  # EnterPlanMode, and ExitPlanMode from its tools whatever is granted. So the case can't fail
  # no-ask-user-question today, and a fixture defaultMode can't help, since project settings
  # aren't loaded and the CLI mode wins. It still checks the round's shape in the reply. The
  # tools stay listed (runs pass --allow-tools EnterPlanMode) so the case discriminates once
  # eval can offer them. Bash is left out: the fixture declares no currency command and no
  # remote, so round 1 needs only reads.
  allowed_tools:
    - Read
    - Glob
    - Grep
    - Skill
    - Agent
    - EnterPlanMode
    - AskUserQuestion
runs: 3
