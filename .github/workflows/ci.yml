name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # check.sh runs claude plugin validate, and the runner has no claude. The
      # exact version is the latest release, npm's latest dist-tag;
      # scripts/currency.sh reports it when it trails.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.289

      - name: Repository consistency checks
        run: bash scripts/check.sh
