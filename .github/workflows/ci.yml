name: CI

on:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Claude Code, which check.sh's plugin validation needs
        run: npm install -g @anthropic-ai/claude-code@2.1.328

      - name: Repository consistency checks
        run: bash scripts/check.sh
